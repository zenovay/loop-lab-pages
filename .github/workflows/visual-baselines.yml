name: visual-baselines

# Rewrites the screenshot baselines on the branch it is started on, in the same container CI
# compares them in, and commits them. Start it by hand after a deliberate visual change.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: npx playwright test --update-snapshots
        env:
          HOME: /root
      - name: Commit the baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual.spec.ts-snapshots
          git diff --cached --quiet && echo "baselines unchanged" && exit 0
          git commit -m "test: screenshot baselines for ${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
